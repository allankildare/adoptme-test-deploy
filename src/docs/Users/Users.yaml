paths:
  /api/users/:
    get:
      summary: Obtém todos os usuários cadastrados no banco de dados
      tags:
        - Users
      responses:
        "200":
          description: Os usuários foram retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#components/schemas/User'
        "500":
          description: Erro interno do servidor, geralmente gerado por uma query mal formatada ou falha de conexão com o banco de dados
  /api/users/{uid}:
    get:
      summary: Obtém um usuário por ID
      tags:
        - Users
      parameters:
      - name: uid
        in: path
        required: true
        description: ID do usuário a ser pesquisado
        schema:
          $type: String
      responses:
        "200":
          description: Usuário encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#components/schemas/User'
    put:
      summary: Atualiza um usuário a partir de seu ID
      tags:
        - Users
      parameters:
      - name: uid
        in: path
        required: true
        description: ID do usuário a ser atualizado
        schema:
          $type: String
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/requestBodies/updateUser'

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: Objectid
          description: ID autogerado pelo MongoDB
        first_name:
          type: String
          description: Nome do usuário
        last_name:
          type: String
          description: Sobrenome do usuário
        email:
          type: String
          description: E-mail do usuário
        password:
          type: String
          description: Senha criptografada do usuário
      example:
        _id: ObjectId("64223867ccd2a47f2bebcb15")
        first_name: Allan
        last_name: Kildare
        email: allan@email.com
        password: p@ssw0rdTest
  requestBodies:
    updateUser:
      type: object
      properties:
        first_name:
          type: String
          description: Nome do usuário
        last_name:
          type: String
          description: Sobrenome do usuário
        email:
          type: String
          description: E-mail do usuário
        password:
          type: String
          description: Senha criptografada do usuário
      example:
        _id: ObjectId("64223867ccd2a47f2bebcb15")
        first_name: Allan
        last_name: Kildare
        email: allan@email.com
        password: p@ssw0rdTest